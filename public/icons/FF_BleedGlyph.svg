<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- BLEED glyph (owner rejection 2026-08-19). The set's
       Neural_HexBleedIndicator is a bare hex with no glyph, and standing the
       generic warning triangle in for it read as "some warning" rather than
       "you are bleeding". The owner's mock used a big red DROPLET here, which
       collides with thirst — the droplet means water, red means blood.
       So: three bold claw gashes raked across the box. A WOUND.
       Solid and unfiltered because this art is used as a MASK.
       Glyph box x 58..200 / y 50..196 of 256. -->
  <g fill="#000">
    <path d="M58 96 Q70.8 156.3 118 196 Q105.2 135.7 58 96 Z" />
    <path d="M98 58 Q109.4 130.8 166 178 Q154.6 105.2 98 58 Z" />
    <path d="M146 50 Q157.5 105.1 200 142 Q188.5 86.9 146 50 Z" />
  </g>
</svg>
